name: "villag_kart"
description: "A new Flutter project."
publish_to: "none"

version: 2.2.9+29

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dotted_border: ^2.1.0
  go_router: ^17.0.0
  video_player: ^2.8.2
  video_player_web: ^2.0.20
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.1.6
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.6.1
  flutter_animate: ^4.5.0
  flutter_bloc: ^8.1.4 # UI integration layer for BlocBuilder, BlocProvider, etc.
  equatable: ^2.0.5 # Value equality for states and events
  dio: ^5.9.0
  socket_io_client: ^3.0.2
  get_it: ^8.0.2
  shared_preferences: ^2.5.3
  webview_flutter: ^4.11.0
  share_plus: ^12.0.1
  intl: ^0.20.2
  razorpay_flutter: ^1.4.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  dotted_line: ^3.2.2
  bloc_concurrency: ^0.2.5
  hydrated_bloc: ^9.1.5
  flutter_html: ^3.0.0
  shimmer: ^3.0.0
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  url_launcher: ^6.3.2
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_dotenv: ^6.0.1
  keyboard_actions: ^4.2.1
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  force_update_helper: ^0.3.0
  firebase_remote_config: ^6.4.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Segoe UI
      fonts:
        - asset: assets/fonts/segoeuithibd.ttf
        - asset: assets/fonts/segoeuithis.ttf
        - asset: assets/fonts/segoeuithisi.ttf
        - asset: assets/fonts/segoeuithisz.ttf

  assets:
    - assets/images/
    - assets/icons/
    - config/
